name: Terraform AWS OIDC Debug

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC claims
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          echo "$ID_TOKEN" |
            cut -d '.' -f2 |
            base64 -d 2>/dev/null |
            jq '{
              aud,
              sub,
              repository,
              repository_id,
              repository_owner,
              repository_owner_id,
              ref,
              event_name
            }'
